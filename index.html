<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Setoran">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hitung Setoran</title>
<style>
:root{--bg:#eef3ee;--card:#fff;--ink:#12261f;--mut:#5d7068;--line:#d9e2da;--acc:#0f766e;--accfg:#fff;--gain:#f2b134;--gainfg:#2a1d00;--soft:#e3ece6;--danger:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1411;--card:#14211c;--ink:#e6f1ea;--mut:#8fa69b;--line:#233630;--acc:#2dd4bf;--accfg:#04201c;--soft:#1b2c26;--danger:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1411;--card:#14211c;--ink:#e6f1ea;--mut:#8fa69b;--line:#233630;--acc:#2dd4bf;--accfg:#04201c;--soft:#1b2c26;--danger:#fb923c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Nunito","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 70px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.ib{height:40px;min-width:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:0 10px;display:grid;place-items:center}
.dn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dn input{flex:1;min-width:130px}
input[type=date]{height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:0 10px;color-scheme:inherit}
.chip{height:34px;border-radius:17px;padding:0 13px;background:var(--soft);font-size:14px;font-weight:600;color:var(--mut)}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accfg)}
.sv{font-size:12.5px;color:var(--acc);height:20px;margin:6px 2px 4px;transition:opacity .6s}
.sv.f{opacity:.45}
.sq{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;margin-bottom:8px}
.chips{display:flex;gap:6px;margin-bottom:12px}
.struk{background:var(--card);border-radius:18px;padding:18px 18px 22px;position:relative;border:1px solid var(--line);margin-bottom:16px}
.struk::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:8px;background:radial-gradient(circle at 6px 8px,var(--bg) 5px,transparent 5.5px) 0 0/16px 8px repeat-x}
.big{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-bottom:14px;border-bottom:2px dashed var(--line)}
.big small{color:var(--mut);display:block;font-size:13px}
.big b{font-size:34px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rows{padding-top:12px;display:grid;gap:8px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.r span:first-child{color:var(--mut)}.r b{font-weight:700}
.r.sub span:first-child{padding-left:10px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.wa{height:28px;border-radius:14px;padding:0 10px;font-size:12.5px;font-weight:600;background:#25d366;color:#06310f}
.acts{display:flex;gap:8px;margin-top:14px}
.acts .btn{flex:1;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{padding:9px 4px;border-radius:11px;font-weight:600;color:var(--mut)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sup{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px 8px;margin-bottom:14px;border-left-width:6px}
.sup h2{font-size:17px;margin:10px 0 2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sup h2 em{font-style:normal;font-size:13px;font-weight:600;color:var(--mut)}
.it{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:11px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.nm{font-weight:600}.nm small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.st{display:flex;align-items:center;gap:4px}
.st button{width:38px;height:38px;border-radius:11px;background:var(--soft);font-size:20px;font-weight:700}
.st button.pk{width:auto;padding:0 9px;font-size:12.5px;background:var(--acc);color:var(--accfg)}
.st input{width:46px;height:38px;text-align:center;border:1px solid var(--line);border-radius:11px;background:transparent;font-weight:700}
.cr{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cr label{font-size:12px;color:var(--mut);display:grid;gap:2px}
.cr input{height:36px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:transparent;width:100%}
.sb{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.sb b{color:var(--ink)}
.fld{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.fld label,.nmf{font-size:12px;color:var(--mut);display:grid;gap:2px}
.fld input,.nmf input,.rowin input{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:transparent;width:100%}
.nmf{grid-column:1/-1}
.row2,.rowin{display:flex;gap:8px;margin-top:8px}
.rowin input:first-child{flex:1.4}.rowin input:nth-child(2){flex:1}
.ex{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ex span{flex:1}.ex b{font-variant-numeric:tabular-nums}
.btn{height:40px;border-radius:12px;padding:0 14px;font-weight:600;background:var(--soft)}
.btn.p{background:var(--acc);color:var(--accfg)}
.btn.d{color:var(--danger)}
.btn.w{width:100%}
.hist{display:grid;gap:8px}
.h{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;text-align:left;font-variant-numeric:tabular-nums}
.h small{color:var(--mut);display:block}
.empty{color:var(--mut);text-align:center;padding:24px 0}
.cht{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px 6px;margin-bottom:14px}
.cht h2{font-size:15px;margin:0 6px 4px}
.cht svg{width:100%;height:auto;display:block}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.md[hidden]{display:none}
.md .bx{background:var(--card);border-radius:18px;padding:20px;max-width:360px;width:100%}
.md p{margin:0 0 16px;font-weight:600}
.md .bt{display:flex;gap:8px}
.tt{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%}
.tt[hidden]{display:none}
#rc{display:none}
@media print{body>*:not(#rc){display:none!important}#rc{display:block;width:58mm;margin:0;color:#000;background:#fff}#rc pre{font:11px/1.35 monospace;white-space:pre-wrap;margin:0}@page{size:58mm auto;margin:2mm}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Hitung Setoran</h1><button class="ib" id="th" aria-label="Ganti mode gelap/terang"></button></div>
  <div class="dn">
    <button class="ib" data-a="prev" aria-label="Hari sebelumnya">&lsaquo;</button>
    <input type="date" id="dt" aria-label="Tanggal">
    <button class="ib" data-a="next" aria-label="Hari berikutnya">&rsaquo;</button>
    <button class="chip" data-a="yday">Kemarin</button>
    <button class="chip" data-a="today">Hari Ini</button>
  </div>
  <div class="sv" id="sv" aria-live="polite"></div>
  <div id="sbar">
    <input type="search" id="sq" class="sq" placeholder="Cari barang atau penyetor..." aria-label="Cari barang" autocomplete="off">
    <div class="chips" id="fl">
      <button class="chip" data-a="filt" data-v="all">Semua</button>
      <button class="chip" data-a="filt" data-v="sold">Ada Penjualan</button>
      <button class="chip" data-a="filt" data-v="unsold">Belum Terjual</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<div class="md" id="md" hidden><div class="bx"><p></p><div class="bt"><button class="btn w" id="mc">Batal</button><button class="btn p w ok"></button></div></div></div>
<div class="tt" id="tt" hidden></div>
<div id="rc"><pre></pre></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script>
var COL=['#0f766e','#d97706','#7c3aed','#db2777','#2563eb','#65a30d'];
var uid=function(){return Math.random().toString(36).slice(2,8)};
var f0=function(n){return Math.round(n).toLocaleString('id-ID')};
var rp=function(n){return (n<0?'-':'')+'Rp'+f0(Math.abs(n))};
var today=function(){return new Date().toLocaleDateString('sv-SE')};
function addDays(d,n){var x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv-SE')}
function fmt(d,o){return new Date(d+'T00:00:00').toLocaleDateString('id-ID',o||{weekday:'long',day:'numeric',month:'short',year:'numeric'})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mk(n,p,s){return {id:uid(),name:n,price:p,setor:s,pack:10}}
function def(){return {suppliers:[
 {id:uid(),name:'A Izal',phone:'',items:[mk('Makaroni jagung',2500,1700),mk('Makaroni rumput laut',2500,1700),mk('Makaroni pedes',2500,1700),mk('Makaroni asin',2500,1700),mk('Makaroni balado (gede)',6000,5000)]},
 {id:uid(),name:'Teh Mia',phone:'',items:[mk('Kulit lumpia jagung',2500,2000),mk('Kulit lumpia pedas',2500,2000),mk('Mi kremes jagung',2500,2000),mk('Mi kremes pedes',2500,2000),mk('Mi kremes jagung (gede)',6000,5000),mk('Lumpia jagung (gede)',6000,5000),mk('Lumpia pedes (gede)',6000,5000),mk('Keripik singkong balado',2000,1500)]}
],sales:{},carry:{},exp:{},theme:''}}
var S;
try{var r0=localStorage.getItem('hs1');S=r0?JSON.parse(r0):def()}catch(e){S=def()}
if(!S||!S.suppliers)S=def();
S.sales=S.sales||{};S.carry=S.carry||{};S.exp=S.exp||{};
var cur=today(),tab='jual',filt='all',svT;
function ind(m,bad){var e=document.getElementById('sv');e.textContent=m;e.style.color=bad?'var(--danger)':'';e.className='sv';clearTimeout(svT);svT=setTimeout(function(){e.className='sv f'},2500)}
function save(){try{localStorage.setItem('hs1',JSON.stringify(S));ind('\u2713 Tersimpan otomatis '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}))}catch(e){ind('Gagal menyimpan di browser ini. Unduh cadangan data.',1)}}
function toast(m){var t=document.getElementById('tt');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3000)}
function theme(){
  var t=S.theme;
  if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');
  var dark=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('th').textContent=dark?'\u2600\uFE0F':'\uD83C\uDF19';
}
function ask(msg,ok,fn){var m=document.getElementById('md'),b=m.querySelector('.ok');m.querySelector('p').textContent=msg;b.textContent=ok;b.onclick=function(){m.hidden=true;fn()};m.hidden=false}
document.getElementById('mc').onclick=function(){document.getElementById('md').hidden=true};
var DL={save:function(o){return new Promise(function(res,rej){
  try{
    var ext=(o.filename.split('.').pop()||'').toLowerCase(),mt={csv:'text/csv',json:'application/json',html:'text/html'}[ext]||'text/plain';
    var u=URL.createObjectURL(new Blob([o.data],{type:mt+';charset=utf-8'})),a=document.createElement('a');
    a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},1500);res({status:'saved'});
  }catch(e){rej(e)}
})}};
function dl(name,data){
  if(!DL)return toast('Unduhan tidak tersedia di tampilan ini');
  DL.save({filename:name,data:data}).then(function(){toast('Tersimpan: '+name)}).catch(function(e){if(!e||e.code!=='declined')toast('Gagal mengunduh file')});
}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

function calc(d){
  var q=S.sales[d]||{},k=0,tot=0,per=[];
  S.suppliers.forEach(function(s,i){
    var a=0,b=0,n=0;
    s.items.forEach(function(it){var c=+q[it.id]||0;a+=c*it.price;b+=c*it.setor;n+=c});
    k+=a;tot+=b;per.push({s:s,gross:a,setor:b,n:n,col:COL[i%COL.length]});
  });
  var e=(S.exp[d]||[]).reduce(function(a,x){return a+(+x.a||0)},0);
  return {gross:k,setor:tot,exp:e,net:k-tot-e,per:per};
}
function sumCard(c){
  var h='<section class="struk"><div class="big"><div><small>Uang bersih kamu</small><b>'+rp(c.net)+'</b></div></div><div class="rows">';
  h+='<div class="r"><span>Pendapatan kotor</span><b>'+rp(c.gross)+'</b></div>';
  h+='<div class="r"><span>Total setoran</span><b>'+rp(c.setor)+'</b></div>';
  h+='<div class="r"><span>Biaya operasional</span><b>'+rp(c.exp)+'</b></div>';
  c.per.forEach(function(p){h+='<div class="r sub"><span><i class="dot" style="background:'+p.col+'"></i>'+esc(p.s.name)+' ('+p.n+' bks)</span><span style="display:flex;gap:8px;align-items:center"><b>'+rp(p.setor)+'</b><button class="wa" data-a="wa" data-s="'+p.s.id+'" aria-label="Kirim rekap ke '+esc(p.s.name)+' lewat WhatsApp">Kirim WA</button></span></div>'});
  h+='</div><div class="acts"><button class="btn" data-a="print">Cetak Struk</button>'+(DL?'<button class="btn" data-a="saveRc">Simpan Struk</button>':'')+'</div>';
  return h+'</section>';
}
function cy(id){return (S.carry[cur]&&S.carry[cur][id])||{}}
function clr(id){if(S.carry[cur])delete S.carry[cur][id]}
function jual(){
  var q=S.sales[cur]||{},h='',c0=calc(cur);
  if(!S.suppliers.length)return '<p class="empty">Belum ada penyetor. Tambah dulu di tab Atur.</p>';
  S.suppliers.forEach(function(s,i){
    h+='<section class="sup" style="border-left-color:'+COL[i%COL.length]+'"><h2>'+esc(s.name)+'<em>setor '+rp(c0.per[i].setor)+'</em></h2>';
    if(!s.items.length)h+='<p class="empty">Belum ada barang.</p>';
    s.items.forEach(function(it){
      var c=+q[it.id]||0,y=cy(it.id);
      h+='<div class="it" data-q="'+c+'"><div class="nm">'+esc(it.name)+'<small>jual '+rp(it.price)+' &middot; setor '+rp(it.setor)+'</small></div>'
      +'<div class="st"><button data-a="dec" data-i="'+it.id+'" aria-label="Kurang">&minus;</button>'
      +'<input type="number" inputmode="numeric" min="0" data-f="qty" data-i="'+it.id+'" value="'+c+'" aria-label="Terjual">'
      +'<button data-a="inc" data-i="'+it.id+'" aria-label="Tambah">+</button>'
      +'<button class="pk" data-a="pack" data-i="'+it.id+'" aria-label="Tambah satu pack">+'+it.pack+'</button></div>'
      +'<div class="cr"><label>Bawa pagi (pack)<input type="number" inputmode="decimal" step="any" min="0" data-f="bawa" data-i="'+it.id+'" value="'+(y.pk===undefined?'':y.pk)+'"></label><label>Sisa malam (bungkus)<input type="number" inputmode="numeric" min="0" data-f="sisa" data-i="'+it.id+'" value="'+(y.sisa===undefined?'':y.sisa)+'"></label></div>'
      +'<div class="sb"><span>kotor <b>'+rp(c*it.price)+'</b></span><span>setor <b>'+rp(c*it.setor)+'</b></span><span>bersih <b>'+rp(c*(it.price-it.setor))+'</b></span></div></div>';
    });
    h+='</section>';
  });
  var L=S.exp[cur]||[];
  h+='<section class="sup nof" style="border-left-color:var(--gain)"><h2>Biaya operasional<em>'+rp(c0.exp)+'</em></h2>';
  L.forEach(function(e,i){h+='<div class="ex"><span>'+esc(e.n)+'</span><b>'+rp(e.a)+'</b><button class="btn d" data-a="delExp" data-x="'+i+'" aria-label="Hapus biaya">Hapus</button></div>'});
  h+='<div class="rowin"><input id="exn" placeholder="mis. bensin, plastik" aria-label="Nama biaya"><input id="exa" type="number" inputmode="numeric" min="0" placeholder="Rp" aria-label="Jumlah biaya"><button class="btn p" data-a="addExp">Tambah</button></div><div style="height:8px"></div></section>';
  return h+'<button class="btn d w" data-a="reset">Kosongkan hitungan hari ini</button>';
}
function atur(){
  var h='';
  S.suppliers.forEach(function(s,i){
    h+='<section class="sup" style="border-left-color:'+COL[i%COL.length]+'"><div class="fld"><label class="nmf">Nama penyetor<input data-f="sname" data-s="'+s.id+'" value="'+esc(s.name)+'"></label><label class="nmf">Nomor WhatsApp (opsional)<input type="tel" inputmode="tel" data-f="sphone" data-s="'+s.id+'" value="'+esc(s.phone||'')+'" placeholder="08123456789"></label></div>';
    s.items.forEach(function(it){
      h+='<div class="it"><div class="fld" style="grid-column:1/-1"><label class="nmf">Nama barang<input data-f="iname" data-s="'+s.id+'" data-i="'+it.id+'" value="'+esc(it.name)+'"></label>'
      +'<label>Harga jual<input type="number" inputmode="numeric" data-f="price" data-s="'+s.id+'" data-i="'+it.id+'" value="'+it.price+'"></label>'
      +'<label>Setor<input type="number" inputmode="numeric" data-f="setor" data-s="'+s.id+'" data-i="'+it.id+'" value="'+it.setor+'"></label>'
      +'<label>Isi 1 pack<input type="number" inputmode="numeric" data-f="pack" data-s="'+s.id+'" data-i="'+it.id+'" value="'+it.pack+'"></label></div>'
      +'<div style="grid-column:1/-1"><button class="btn d" data-a="delItem" data-s="'+s.id+'" data-i="'+it.id+'">Hapus barang</button></div></div>';
    });
    h+='<div class="row2"><button class="btn p" data-a="addItem" data-s="'+s.id+'">Tambah barang</button><button class="btn d" data-a="delSup" data-s="'+s.id+'">Hapus penyetor</button></div><div style="height:8px"></div></section>';
  });
  h+='<button class="btn p w" data-a="addSup">Tambah penyetor baru</button>';
  h+='<section class="sup nof" style="margin-top:14px"><h2>Cadangan data</h2><p style="color:var(--mut);font-size:14px;margin:4px 0 10px">Data tersimpan di browser ini. Unduh cadangan secara berkala supaya aman kalau cache terhapus.</p><div class="row2" style="margin-bottom:10px">'+(DL?'<button class="btn" data-a="bk" style="flex:1">Unduh Cadangan Data</button>':'')+'<button class="btn" data-a="rs" style="flex:1">Pulihkan Data</button></div></section>';
  return h;
}
function short(n){var a=Math.abs(n);return (n<0?'-':'')+(a>=1000?String(Math.round(a/100)/10).replace('.',',')+'k':a)}
function chart(){
  var days=[],i;for(i=6;i>=0;i--)days.push(addDays(cur,-i));
  var v=days.map(function(d){return calc(d).net}),mx=Math.max.apply(null,v.concat([0])),mn=Math.min.apply(null,v.concat([0])),rg=(mx-mn)||1,T=20,B=112;
  var y=function(x){return T+(mx-x)/rg*(B-T)},y0=y(0),s='<svg viewBox="0 0 320 150" role="img" aria-label="Grafik uang bersih 7 hari terakhir"><line x1="6" x2="314" y1="'+y0+'" y2="'+y0+'" stroke="var(--line)" stroke-width="1.5"/>';
  v.forEach(function(n,k){
    var x=14+k*44,yy=y(n),h=Math.max(2,Math.abs(yy-y0)),top=n>=0?y0-h:y0;
    s+='<rect x="'+x+'" y="'+top+'" width="30" height="'+h+'" rx="6" fill="'+(k===6?'var(--gain)':'var(--acc)')+'" opacity="'+(n?1:.25)+'"/>';
    s+='<text x="'+(x+15)+'" y="'+(n>=0?top-5:top+h+12)+'" text-anchor="middle" font-size="10" fill="var(--mut)">'+(n?short(n):'')+'</text>';
    s+='<text x="'+(x+15)+'" y="138" text-anchor="middle" font-size="11" fill="var(--mut)">'+fmt(days[k],{weekday:'short'})+'</text>';
    s+='<text x="'+(x+15)+'" y="149" text-anchor="middle" font-size="9" fill="var(--mut)">'+days[k].slice(8)+'</text>';
  });
  return '<section class="cht"><h2>Uang bersih 7 hari terakhir</h2>'+s+'</svg></section>';
}
function riwayat(){
  var ds=Object.keys(S.sales).filter(function(d){return calc(d).gross>0}).sort().reverse().slice(0,60);
  var h=chart();
  if(!ds.length)return h+'<p class="empty">Belum ada riwayat. Isi jualan hari ini dulu.</p>';
  if(DL)h+='<button class="btn w" data-a="csv" style="margin-bottom:12px">Ekspor Riwayat ke CSV</button>';
  return h+'<div class="hist">'+ds.map(function(d){var c=calc(d);
    return '<button class="h" data-a="goto" data-d="'+d+'"><span>'+fmt(d,{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'<small>kotor '+rp(c.gross)+' &middot; setoran '+rp(c.setor)+(c.exp?' &middot; biaya '+rp(c.exp):'')+'</small></span><b>'+rp(c.net)+'</b></button>'}).join('')+'</div>';
}
function render(){
  var c=calc(cur),t=[['jual','Jualan'],['hist','Riwayat'],['atur','Atur']];
  var h=(tab==='jual'?sumCard(c):'');
  h+='<div class="tabs" role="tablist">'+t.map(function(x){return '<button role="tab" data-a="tab" data-t="'+x[0]+'" aria-selected="'+(tab===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  h+=tab==='jual'?jual():tab==='atur'?atur():riwayat();
  var y=window.scrollY;document.getElementById('app').innerHTML=h;window.scrollTo(0,y);
  document.getElementById('dt').value=cur;applyQ();
}
function applyQ(){
  var box=document.getElementById('sq'),t=(box.value||'').trim().toLowerCase();
  document.getElementById('sbar').style.display=tab==='hist'?'none':'';
  document.getElementById('fl').style.display=tab==='jual'?'':'none';
  document.querySelectorAll('#fl .chip').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===filt)});
  var old=document.querySelector('.nores');if(old)old.remove();
  if(tab==='hist')return;
  var sups=document.querySelectorAll('#app .sup:not(.nof)'),shown=0;
  sups.forEach(function(sp){
    var h2=sp.querySelector('h2'),sn=sp.querySelector('[data-f=sname]');
    var name=(h2?h2.firstChild.textContent:(sn?sn.value:'')).toLowerCase();
    var all=!t||name.indexOf(t)>-1,n=0,its=sp.querySelectorAll('.it');
    its.forEach(function(el){
      var nm=el.querySelector('.nm'),inp=el.querySelector('[data-f=iname]');
      var txt=(nm?nm.firstChild.textContent:(inp?inp.value:'')).toLowerCase();
      var ok=all||txt.indexOf(t)>-1;
      if(ok&&el.dataset.q!==undefined){var sold=+el.dataset.q>0;if((filt==='sold'&&!sold)||(filt==='unsold'&&sold))ok=false}
      el.style.display=ok?'':'none';if(ok)n++;
    });
    var vis=n>0||(!its.length&&all&&filt==='all');sp.style.display=vis?'':'none';if(vis)shown++;
  });
  if((t||filt!=='all')&&sups.length&&!shown){var d=document.createElement('p');d.className='empty nores';d.textContent=t?'Tidak ada yang cocok dengan "'+box.value.trim()+'".':'Tidak ada barang untuk filter ini.';document.getElementById('app').appendChild(d)}
}
function findItem(id){for(var i=0;i<S.suppliers.length;i++)for(var j=0;j<S.suppliers[i].items.length;j++)if(S.suppliers[i].items[j].id===id)return S.suppliers[i].items[j]}
function sup(id){return S.suppliers.filter(function(s){return s.id===id})[0]}
function setQ(id,v){S.sales[cur]=S.sales[cur]||{};S.sales[cur][id]=Math.max(0,Math.floor(+v||0))}

function rcpt(d){
  var c=calc(d),q=S.sales[d]||{},L=[],ln='--------------------------------',pad=function(a,b){return a+' '.repeat(Math.max(1,32-a.length-b.length))+b};
  L.push('HITUNG SETORAN',fmt(d),ln);
  S.suppliers.forEach(function(s){
    var rows=s.items.filter(function(it){return +q[it.id]>0});if(!rows.length)return;
    L.push(s.name.toUpperCase());
    rows.forEach(function(it){var n=+q[it.id];L.push(it.name);L.push(pad('  '+n+' x '+f0(it.price),f0(n*it.price)))});L.push(ln);
  });
  L.push(pad('Kotor',rp(c.gross)),pad('Setoran',rp(c.setor)));
  c.per.forEach(function(p){if(p.n)L.push(pad('  '+p.s.name,rp(p.setor)))});
  (S.exp[d]||[]).forEach(function(e){L.push(pad('Biaya '+e.n,rp(e.a)))});
  L.push(ln,pad('BERSIH',rp(c.net)),ln,'Terima kasih');
  return L.join('\n');
}
function waText(s){
  var q=S.sales[cur]||{},L=['*Rekap setoran '+s.name+'*',fmt(cur),''],tot=0,n=0;
  s.items.forEach(function(it){var c=+q[it.id]||0;if(!c)return;n+=c;tot+=c*it.setor;L.push('\u2022 '+it.name+': '+c+' bks \u00D7 '+f0(it.setor)+' = '+rp(c*it.setor))});
  if(!n)L.push('(belum ada barang terjual)');
  L.push('','*Total terjual: '+n+' bungkus*','*Total setoran: '+rp(tot)+'*');
  return L.join('\n');
}
function sendWA(id){
  var s=sup(id),ph=String(s.phone||'').replace(/\D/g,'');
  if(ph.charAt(0)==='0')ph='62'+ph.slice(1);
  var t=waText(s),w=null;
  try{w=window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(t),'_blank','noopener')}catch(e){}
  if(!w){try{navigator.clipboard.writeText(t).then(function(){toast('Rekap disalin. Tempel di WhatsApp.')},function(){toast('Tidak bisa membuka WhatsApp')})}catch(e){toast('Tidak bisa membuka WhatsApp')}}
}
function csvQ(v){return '"'+String(v).replace(/"/g,'""')+'"'}
function exportCSV(){
  var ds=Object.keys(S.sales).filter(function(d){return calc(d).gross>0}).sort();
  var H=['Tanggal','Pendapatan Kotor'].concat(S.suppliers.map(function(s){return 'Setoran '+s.name}),['Total Setoran','Biaya Operasional','Uang Bersih']);
  var R=[H.map(csvQ).join(',')];
  ds.forEach(function(d){var c=calc(d);R.push([d,c.gross].concat(c.per.map(function(p){return p.setor}),[c.setor,c.exp,c.net]).map(csvQ).join(','))});
  dl('riwayat-setoran.csv','\uFEFF'+R.join('\r\n'));
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,i=b.dataset.i,s=b.dataset.s,q=(S.sales[cur]||{});
  if(a==='tab'){tab=b.dataset.t}
  else if(a==='inc'){setQ(i,(+q[i]||0)+1);clr(i)}
  else if(a==='dec'){setQ(i,(+q[i]||0)-1);clr(i)}
  else if(a==='pack'){setQ(i,(+q[i]||0)+(findItem(i).pack||10));clr(i)}
  else if(a==='goto'){cur=b.dataset.d;tab='jual'}
  else if(a==='prev'){cur=addDays(cur,-1)}
  else if(a==='next'){cur=addDays(cur,1)}
  else if(a==='yday'){cur=addDays(today(),-1)}
  else if(a==='today'){cur=today()}
  else if(a==='filt'){filt=b.dataset.v;applyQ();return}
  else if(a==='addItem'){sup(s).items.push({id:uid(),name:'Barang baru',price:2500,setor:2000,pack:10})}
  else if(a==='addSup'){S.suppliers.push({id:uid(),name:'Penyetor baru',phone:'',items:[]})}
  else if(a==='addExp'){
    var n=document.getElementById('exn').value.trim(),m=Math.round(+document.getElementById('exa').value||0);
    if(!m){toast('Isi jumlah biaya dulu');return}
    (S.exp[cur]=S.exp[cur]||[]).push({n:n||'Biaya',a:m});
  }
  else if(a==='delExp'){(S.exp[cur]||[]).splice(+b.dataset.x,1)}
  else if(a==='reset'){ask('Kosongkan semua hitungan, sisa, dan biaya untuk '+fmt(cur)+'?','Ya, kosongkan',function(){delete S.sales[cur];delete S.carry[cur];delete S.exp[cur];save();render()});return}
  else if(a==='delItem'){var it=findItem(i);ask('Hapus barang "'+it.name+'"? Data penjualan lama untuk barang ini tidak akan terhitung lagi.','Ya, hapus',function(){var p=sup(s);p.items=p.items.filter(function(x){return x.id!==i});save();render()});return}
  else if(a==='delSup'){ask('Hapus penyetor "'+sup(s).name+'" beserta semua barangnya?','Ya, hapus',function(){S.suppliers=S.suppliers.filter(function(x){return x.id!==s});save();render()});return}
  else if(a==='wa'){sendWA(s);return}
  else if(a==='print'){document.querySelector('#rc pre').textContent=rcpt(cur);try{window.print()}catch(x){toast('Cetak tidak tersedia di tampilan ini')}return}
  else if(a==='saveRc'){dl('struk-'+cur+'.html','<!DOCTYPE html><html lang="id"><meta charset="utf-8"><title>Struk '+cur+'</title><style>@page{size:58mm auto;margin:2mm}body{width:58mm;margin:0}pre{font:11px/1.35 monospace;white-space:pre-wrap}</style><body><pre>'+esc(rcpt(cur))+'</pre></body></html>');return}
  else if(a==='bk'){dl('cadangan-setoran-'+today()+'.json',JSON.stringify(S));return}
  else if(a==='rs'){document.getElementById('fi').click();return}
  else if(a==='csv'){exportCSV();return}
  save();render();
});
document.addEventListener('change',function(e){
  var f=e.target.dataset.f;if(!f)return;
  var v=e.target.value,i=e.target.dataset.i,s=e.target.dataset.s;
  if(f==='qty'){setQ(i,v);clr(i)}
  else if(f==='bawa'||f==='sisa'){
    var cc=S.carry[cur]=S.carry[cur]||{},o=cc[i]=cc[i]||{};
    o[f==='bawa'?'pk':'sisa']=v===''?undefined:Math.max(0,+v||0);
    setQ(i,(o.pk||0)*(findItem(i).pack||10)-(o.sisa||0));
  }
  else if(f==='sname')sup(s).name=v.trim()||'Penyetor';
  else if(f==='sphone')sup(s).phone=v.trim();
  else{var it=findItem(i);if(f==='iname')it.name=v.trim()||'Barang';else it[f]=Math.max(f==='pack'?1:0,Math.round(+v||0))}
  save();render();
});
document.getElementById('fi').addEventListener('change',function(e){
  var file=e.target.files[0];e.target.value='';if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    var d;try{d=JSON.parse(rd.result)}catch(x){}
    if(!d||!Array.isArray(d.suppliers)){toast('File cadangan tidak valid');return}
    ask('Ganti semua data saat ini dengan isi file cadangan ini?','Ya, pulihkan',function(){S=d;S.sales=S.sales||{};S.carry=S.carry||{};S.exp=S.exp||{};save();theme();render();toast('Data berhasil dipulihkan')});
  };
  rd.onerror=function(){toast('Gagal membaca file')};
  rd.readAsText(file);
});
document.getElementById('dt').addEventListener('change',function(e){if(e.target.value){cur=e.target.value;render()}});
document.getElementById('th').addEventListener('click',function(){
  var dark=S.theme?S.theme==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme=dark?'light':'dark';save();theme();
});
document.getElementById('sq').addEventListener('input',applyQ);
theme();render();
</script>
</body>
</html>
